<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eRPH SKJB</title>
<meta name="theme-color" content="#065f46">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --em-900:#053b2e; --em-800:#065f46; --em-700:#047857; --em-600:#059669; --em-100:#d1fae5; --em-50:#ecfdf5;
  --cream:#fbf7ee; --cream-2:#f4eedf; --card:#ffffff; --ink:#1c2a24; --muted:#66756e; --line:#e6e0d0;
  --gold:#b7791f; --gold-bg:#fdf3dc; --red:#b42318; --red-bg:#fdecea; --blue:#1d4ed8; --blue-bg:#e8efff;
  --grey:#55625c; --grey-bg:#eef0ec; --green:#067647; --green-bg:#dcfae6;
  --r:14px; --sh:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--em-700)}
h1,h2,h3{margin:0;line-height:1.25}
.hidden{display:none!important}

/* shell */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--em-900) 260px,transparent 260px)}
.side{background:var(--em-900);color:#e9f5ef;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#34d399,#047857);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand small{color:#a7d7c2;font-size:11.5px}
.clock{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.clock .t{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.clock small{display:block;color:#a7d7c2;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:#7fb9a1;margin:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#d8efe5;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:#f4eedf;color:var(--em-900);font-weight:700}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.nav a .bdg{margin-left:auto;background:#f59e0b;color:#1c1300;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
.me{margin-top:auto;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;font-size:13px}
.me b{display:block}
.me small{color:#a7d7c2}
.me button{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px}
main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);background:rgba(251,247,238,.9);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.top h2{font-size:17px}
.top .sp{flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;cursor:pointer}
.mode{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gold-bg);color:var(--gold)}
.mode.live{background:var(--green-bg);color:var(--green)}
#view{padding:22px 26px 60px;max-width:1240px}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.mt{margin-top:16px}.mt2{margin-top:24px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#cfc6ae}
.btn.pri{background:var(--em-700);border-color:var(--em-700);color:#fff}
.btn.pri:hover{background:var(--em-800)}
.btn.ai{background:linear-gradient(135deg,#047857,#0d9488 60%,#b7791f);border:none;color:#fff}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.c-grey{background:var(--grey-bg);color:var(--grey)}.c-blue{background:var(--blue-bg);color:var(--blue)}.c-red{background:var(--red-bg);color:var(--red)}.c-green{background:var(--green-bg);color:var(--green)}.c-gold{background:var(--gold-bg);color:var(--gold)}
label.f{display:block;font-size:12.5px;font-weight:600;color:#3d4a44;margin-bottom:5px}
.in{width:100%;border:1px solid #ddd5c2;background:#fffdf8;border-radius:10px;padding:9px 11px;outline:none}
.in:focus{border-color:var(--em-600);box-shadow:0 0 0 3px rgba(5,150,105,.15);background:#fff}
textarea.in{resize:vertical;min-height:64px;white-space:pre-wrap}
.in[readonly],.in:disabled{background:#f6f3ea;color:#4b5852}
.fld{margin-bottom:12px}
.hero{background:linear-gradient(120deg,var(--em-800),var(--em-600) 70%,#0f766e);color:#fff;border-radius:18px;padding:22px 24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero h1{font-size:23px}
.hero p{margin:6px 0 0;color:#d1fae5}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{font-size:26px;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fffdf8}
.item .tm{font-size:11.5px;font-weight:700;background:var(--cream-2);border-radius:7px;padding:3px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:#fffdf8}
.deadline{display:flex;gap:14px;align-items:center;border-radius:14px;padding:14px 16px;background:var(--gold-bg);border:1px solid #f1d9a6}
.deadline.late{background:var(--red-bg);border-color:#f5c2bc}
.deadline.done{background:var(--green-bg);border-color:#a6e9c0}
.deadline .big{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav b{min-width:210px;text-align:center}
.day{margin-top:18px}
.day h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.day h4 .d{color:var(--muted);font-weight:500}
.rcard{border:1px solid var(--line);border-left:4px solid var(--grey-bg);border-radius:12px;background:#fff;padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rcard.s-dihantar{border-left-color:#93b4fb}.rcard.s-pembetulan{border-left-color:#f19a90}.rcard.s-disahkan{border-left-color:#6ce0a0}.rcard.s-draf{border-left-color:#cfd5cf}
.rcard.kosong{border-style:dashed;background:#fffdf8}
.rcard .grow{flex:1;min-width:180px}
.rcard .grow b{display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:#fbf8f0}
table.t td{padding:9px 10px;border-bottom:1px solid #f0ebde;vertical-align:top}
table.t tr:hover td{background:#fffcf3}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.bar{height:8px;background:#eee8d8;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--em-600)}
.tt{display:grid;grid-template-columns:90px repeat(5,minmax(120px,1fr));gap:6px;min-width:760px}
.tt .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:6px}
.tt .cell{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:60px}
.slot{background:var(--em-50);border:1px solid #bfe9d4;border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:12.5px;position:relative}
.slot b{display:block;color:var(--em-800)}
.slot .x{position:absolute;right:4px;top:2px;border:none;background:none;cursor:pointer;color:#9aa;font-size:14px}
.section-t{font-size:13px;font-weight:800;color:var(--em-800);text-transform:uppercase;letter-spacing:.8px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.lock{background:var(--blue-bg);color:var(--blue);border-radius:12px;padding:10px 14px;font-weight:600;font-size:13px}
.log{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-bottom:10px}
.log.pembetulan{border-color:#f19a90}.log.disahkan{border-color:#6ce0a0}.log.ulasan{border-color:#f1d9a6}
.log b{font-size:13px}.log small{color:var(--muted)}
.log p{margin:3px 0 0;white-space:pre-wrap}

/* doc */
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}
.doc .dh{text-align:center;border-bottom:2px solid var(--em-800);padding-bottom:10px;margin-bottom:12px}
.doc .dh b{font-size:15px;letter-spacing:.5px}
.doc table{width:100%;border-collapse:collapse;font-size:13px}
.doc td,.doc th{border:1px solid #cfd8d3;padding:7px 9px;vertical-align:top;text-align:left}
.doc th{background:#eef7f2;width:24%;font-weight:700;color:var(--em-900)}
.doc .pre{white-space:pre-wrap}
.stamp{display:inline-block;border:2px solid var(--green);color:var(--green);border-radius:8px;padding:4px 10px;font-weight:800;transform:rotate(-2deg)}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,30,22,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--cream);border-radius:18px;width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{width:min(980px,100%)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{font-size:16px;flex:1}
.modal .mb{padding:18px 20px;overflow:auto}
.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x-btn{border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--em-900);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:var(--sh);font-weight:600;font-size:13.5px;max-width:90vw}
#toast div.err{background:var(--red)}
.prog{height:10px;background:#e8e1cf;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#059669,#b7791f);transition:width .3s}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:radial-gradient(circle at 20% 20%,#0f766e,transparent 50%),linear-gradient(140deg,var(--em-900),var(--em-700));color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center}
.login .l h1{font-size:38px;line-height:1.15}
.login .l p{color:#cdeee0;max-width:460px}
.login .feat{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.login .feat span{background:rgba(255,255,255,.12);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600}
.login .r{display:grid;place-items:center;padding:32px}
.login .box{width:min(420px,100%)}
.tabs{display:flex;background:var(--cream-2);border-radius:10px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:none;background:none;padding:7px;border-radius:8px;font-weight:600;cursor:pointer}
.tabs button.on{background:#fff;box-shadow:var(--sh)}
.demo-u{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer;margin-bottom:8px}
.demo-u:hover{border-color:var(--em-600)}
.av{width:36px;height:36px;border-radius:50%;background:var(--em-100);color:var(--em-800);display:grid;place-items:center;font-weight:800;flex:none}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;background:none}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .menu-btn{display:inline-block}
  .top{padding:12px 16px}
  #view{padding:16px 16px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .login{grid-template-columns:1fr}
  .login .l{padding:32px 20px}
  .login .l h1{font-size:28px}
  .weeknav b{min-width:0}
}
@media print{
  body{background:#fff}
  .side,.top,.noprint,#toast{display:none!important}
  .shell{display:block}
  #view{padding:0;max-width:none}
  .doc{border:none;padding:0}
  .ov{position:static;background:none;padding:0;display:block}
  .modal{box-shadow:none;max-height:none;background:#fff}
  .modal .mh,.modal .mf{display:none}
  body.modal-open .shell{display:none}
}

.tm{font-size:11.5px;font-weight:700;background:var(--cream-2);border-radius:7px;padding:3px 7px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:11px;width:40px;height:38px;font-size:17px;cursor:pointer}
.bell .bdg{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:99px;font-size:10.5px;font-weight:800;padding:1px 6px;border:2px solid var(--cream)}
.nitem{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer}
.nitem b{display:block;font-size:13.5px}.nitem span{display:block;font-size:13px;color:#3d4a44;margin-top:2px}.nitem small{color:var(--muted);font-size:11.5px}
.nitem.unread{border-left:4px solid var(--em-600);background:var(--em-50)}
.me button+button{margin-left:4px}
.hubbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:11px;height:38px;padding:0 12px;font-weight:700;font-size:13px;color:var(--em-800);text-decoration:none;white-space:nowrap}
.hubbtn:hover{border-color:var(--em-600);background:var(--em-50)}
@media (max-width:480px){.hubbtn span{display:none}.hubbtn:after{content:"Hub"}}
.rptbar{background:var(--em-50);border:1px solid #bfe9d4;border-radius:12px;padding:12px;margin-bottom:14px}
.rptnote{background:var(--gold-bg);border:1px solid #f1d9a6;border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.stdc{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:6px;font-size:13px;cursor:pointer}
.stdc input{margin-top:3px}
.ms{position:relative}.ms .in{padding-right:44px}
.ms-btn{position:absolute;right:5px;top:5px;bottom:5px;width:34px;border:none;background:var(--em-100);color:var(--em-800);border-radius:8px;cursor:pointer;font-size:14px;font-weight:800}
.ms-panel{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,40,30,.15);max-height:280px;overflow:auto;padding:6px}
.ms-panel label{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;font-size:13px;cursor:pointer}
.ms-panel label:hover{background:var(--em-50)}
.tgchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rpt-ed td{min-width:110px;white-space:pre-wrap;font-size:12.5px}.rpt-ed td[contenteditable]:focus{outline:2px solid var(--em-600);background:#fff}
.gbtn{width:100%;justify-content:center;padding:11px;font-size:14.5px;gap:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:16px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
<div id="app"><div style="display:grid;place-items:center;min-height:100vh;color:#66756e">Memuatkan eRPH…</div></div>
<div id="modal"></div>
<div id="toast"></div>
<script type="module">
/* =====================================================================
   eRPH SKJB — Sistem Rancangan Pengajaran Harian (Supabase)
   ===================================================================== */
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

const SUPABASE_URL = "https://smeykkqkbxpivipsmuck.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtZXlra3FrYnhwaXZpcHNtdWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNjQxMzQsImV4cCI6MjEwOTc0MDEzNH0.REvRUMTaEXzi2hU0ohc3JiaVEMzX3dHsiSLCSsM54EI";
const VAPID_PUBLIC = "BN00zWf5WXnVugKPJ1AGh6FenhT_2rEYH9NvHw4Sw9pmzpOdSpYlLa5mEqcKnaCpscjL-FPQjwGAh21xz8h1ljo";
const HUB_URL = "https://skjalanbintang.github.io/destarx/";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: "pkce", detectSessionInUrl: true, persistSession: true } });

/* ---------- utiliti ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const today = () => iso(new Date());
const HARI = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];

function buildPrompt(r, opt = {}) {
  const mins = minit(r.mula, r.tamat), bi = /inggeris|english/i.test(r.subjek);
  return `Anda ialah guru cemerlang sekolah rendah di Malaysia yang pakar dalam KSSR (Semakan 2017) dan DSKP terkini.
Bina SATU Rancangan Pengajaran Harian (RPH) yang lengkap, realistik dan boleh terus digunakan.

MAKLUMAT:
- Mata pelajaran: ${r.subjek}
- Kelas: ${r.kelas} (Tahun ${tahunDari(r.kelas) || "?"})
- Tarikh: ${r.tarikh ? fmtT(r.tarikh) : "-"} (Minggu persekolahan ke-${r.tarikh ? weekNo(r.tarikh) : "?"})
- Tempoh: ${mins} minit
- Tema/Tajuk diberi guru: ${r.tajuk || r.tema || "(tiada — cadangkan tajuk yang sesuai mengikut DSKP bagi minggu ini)"}
- Standard Kandungan diberi: ${r.sk || "(tiada)"}
- Standard Pembelajaran diberi: ${r.sp || "(tiada)"}
- Catatan guru: ${opt.catatan || "(tiada)"}
- Gaya: ${opt.gaya === "ringkas" ? "ringkas dan padat" : "terperinci"}

PERATURAN:
1. ${bi ? "Write ALL content in English (this is an English Language lesson)." : "Tulis dalam Bahasa Melayu baku."}
2. Gunakan nombor SK/SP mengikut DSKP hanya jika anda pasti; jika tidak pasti, tulis huraian tanpa nombor.
3. Objektif bermula "Pada akhir PdP, murid dapat:" diikuti 2–3 objektif bernombor yang boleh diukur.
4. Aktiviti utama bernombor, berpusatkan murid, sesuai dengan tempoh ${mins} minit, dan menyebut teknik PAK-21 yang digunakan.
5. Jika guru memberi SK/SP/tajuk, kekalkan maklumat itu.

Pulangkan JSON SAHAJA (tiada teks lain) dengan kunci tepat berikut, semua nilai jenis string (guna \\n untuk baris baharu):
{"tema":"","tajuk":"","sk":"","sp":"","objektif":"","kriteria":"","induksi":"","utama":"","penutup":"","bbm":"","emk":"","nilai":"","pak21":"","kbat":"","pbd":"","strategi":""}`;
}
function parseJSON(t) {
  t = String(t || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const o = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1)), out = {};
  for (const k of AI_KEYS) out[k] = Array.isArray(o[k]) ? o[k].join("\n") : String(o[k] ?? "");
  return out;
}
const aiSource = () => S.aiReady ? "gemini" : "contoh";
async function aiGenerate(r, opt) {
  if (!S.aiReady) { await sleep(400); return templateRPH(r); }
  const { data, error } = await sb.functions.invoke("jana-rph", { body: { prompt: buildPrompt(r, opt) } });
  if (error) throw new Error(error.message);
  if (data?.tiada_kunci) { S.aiReady = false; return templateRPH(r); }
  if (data?.error) throw new Error(data.error);
  return parseJSON(data.text);
}

    utama: `1. Guru menerangkan konsep asas ${tajuk} menggunakan bahan maujud dan contoh.\n2. Murid dibahagikan kepada kumpulan kecil dan berbincang menggunakan teknik Round Robin.\n3. Setiap kumpulan menghasilkan peta i-Think tentang ${tajuk}.\n4. Murid membentangkan hasil kerja secara Gallery Walk.\n5. Murid menjawab lembaran kerja secara individu; guru membimbing murid yang memerlukan.`,

  };
}

async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
  const qs = new URLSearchParams(location.search), hs = new URLSearchParams(location.hash.replace(/^#\/?/, "").split("?")[0]);
  const oauthErr = qs.get("error_description") || hs.get("error_description");
  const { data: { session } } = await sb.auth.getSession();
  if (qs.has("code") || qs.has("error") || hs.has("error")) history.replaceState(null, "", location.pathname + (hs.has("error") ? "" : location.hash));
  if (session?.user) await afterLogin(session.user);
  else { renderLogin(); if (oauthErr) toast("Log masuk Google gagal: " + oauthErr.replace(/\+/g, " "), true); }
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") { S.user = null; renderLogin(); } });
}
async function afterLogin(u) {
  try {
    S.user = { uid: u.id, email: u.email };
    const [settings, profile, ai] = await Promise.all([
      q(sb.from("settings").select("*").eq("id", 1).single()),
      q(sb.from("profiles").select("*").eq("id", u.id).maybeSingle()),
      sb.rpc("status_ai")
    ]);
    if (!profile) throw new Error("Profil tidak dijumpai. Hubungi pentadbir.");
    if (!profile.aktif) {
      await sb.auth.signOut();
      return toast(profile.menunggu ? `Akaun ${profile.email} sedang menunggu kelulusan pentadbir. Anda akan dapat log masuk selepas diluluskan.` : "Akaun anda telah dinyahaktifkan. Hubungi pentadbir.", true);
    }
    const viaGoogle = sessionStorage.getItem("erph_google") === "1" || u.app_metadata?.provider === "google";
    sessionStorage.removeItem("erph_google");
    S.settings = settings; S.profile = profile; S.isAdmin = profile.peranan === "pentadbir"; S.aiReady = !!ai.data;
    await refreshData();
    renderShell(); route(); startNotif();
    if (profile.tukar_kata_laluan && !viaGoogle) openPassword(true);
  } catch (e) { console.error(e); renderLogin(); toast(e.message, true); }
}
async function refreshData() {
  const [my, slots, ta] = await Promise.all([
    q(sb.from("rph").select("*").eq("uid", S.user.uid)),
    q(sb.from("slots").select("*").eq("uid", S.user.uid)),
    q(sb.from("tarikh_akhir").select("*")),
    q(sb.from("rpt").select("*").eq("uid", S.user.uid).order("subjek"))
  ]).then(r => { S.rpt = r[3]; return r; });
  S.my = my; S.slots = slots.sort((a, b) => a.hari - b.hari || a.mula.localeCompare(b.mula));
  S.ta = Object.fromEntries(ta.map(t => [t.isnin, t]));
  await refreshPending();
}
async function refreshPending() {
  if (!S.isAdmin) return;
  const { count } = await sb.from("rph").select("id", { count: "exact", head: true }).eq("status", "dihantar");
  S.pending = count || 0; updateBadges();
}

let notifCh = null;
async function startNotif() {
  stopNotif();
  S.notif = await q(sb.from("notifikasi").select("*").eq("user_id", S.user.uid).order("dicipta", { ascending: false }).limit(40));
  updateBadges();

    .on("postgres_changes", { event: "*", schema: "public", table: "notifikasi", filter: `user_id=eq.${S.user.uid}` }, async p => {
      if (p.eventType === "DELETE") S.notif = S.notif.filter(n => n.id !== p.old.id);
      else {
        const n = p.new, fresh = !n.dibaca && (p.eventType === "INSERT" || S.notif.find(x => x.id === n.id)?.dicipta !== n.dicipta);
        S.notif = [n, ...S.notif.filter(x => x.id !== n.id)].sort((a, b) => b.dicipta.localeCompare(a.dicipta));
        if (fresh) {

          if (/^semak/.test(n.kunci)) refreshPending();

function stopNotif() { if (notifCh) { sb.removeChannel(notifCh); notifCh = null; } }
function drawNotifList() {

    : `<div class="empty">Tiada notifikasi.</div>`;
}
const urlB64 = b => { const p = "=".repeat((4 - b.length % 4) % 4), s = atob((b + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...s].map(c => c.charCodeAt(0))); };
async function pushStatus() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return "tiada";
  const reg = await navigator.serviceWorker.getRegistration(); const sub = await reg?.pushManager.getSubscription();
  if (Notification.permission === "denied") return "disekat";
  return sub ? "aktif" : "tidak";
}
async function enablePush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window))
    throw new Error(/iphone|ipad/i.test(navigator.userAgent) ? "Di iPhone/iPad: tekan Kongsi → Tambah ke Skrin Utama, buka eRPH dari ikon itu, kemudian hidupkan notifikasi." : "Pelayar ini tidak menyokong notifikasi push.");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Kebenaran notifikasi tidak diberi. Benarkan di tetapan pelayar.");
  await navigator.serviceWorker.register("sw.js"); const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(VAPID_PUBLIC) });
  const j = sub.toJSON();
  await q(sb.from("push_subs").upsert({ user_id: S.user.uid, endpoint: j.endpoint, sub: j }, { onConflict: "endpoint" }));
}

  const tm = s => `<span class="tm">${s.mula}–${s.tamat}</span>`;
  let html = `<div class="row between"><div class="weeknav"><a class="btn sm" href="#/rph/${addDays(mon, -7)}">‹</a><b>Minggu ${weekNo(mon)} · ${fmtTs(mon)} – ${fmtTs(addDays(mon, 4))}</b><a class="btn sm" href="#/rph/${addDays(mon, 7)}">›</a><a class="btn sm ghost" href="#/rph">Minggu ini</a></div>

    <div class="mt">${deadlineBox(mon, list)}</div>`;
  for (let i = 0; i < 5; i++) {
    const d = addDays(mon, i), sl = slotsFor(d), rs = list.filter(r => r.tarikh === d);
    const extra = rs.filter(r => !sl.some(s => findRph(d, s)?.id === r.id)), kosong = sl.filter(s => !findRph(d, s)).length;
    html += `<div class="day"><h4>${HARI[parse(d).getDay()]} <span class="d">${fmtT(d).split(", ")[1]}</span>${d === today() ? `<span class="chip c-green">Hari ini</span>` : ""}

async function saveRph(rec, target) {
  if (!rec.tarikh || !rec.subjek || !rec.kelas) { toast("Sila isi tarikh, mata pelajaran dan kelas.", true); return null; }
  rec.isnin = mondayOf(rec.tarikh); rec.minggu = weekNo(rec.tarikh); rec.guru_nama = S.profile.nama;
  if (!rec.mula) rec.mula = null; if (!rec.tamat) rec.tamat = null;
  if (target === "dihantar") {
    rec.status = "dihantar";
    rec.log = [...(rec.log || []), { nama: S.profile.nama, tindakan: "dihantar", teks: "", masa: new Date().toISOString() }];
  } else if (!rec.status) rec.status = "draf";
  const row = Object.fromEntries(COLS.filter(k => k in rec).map(k => [k, rec[k] === "" && ["mula", "tamat"].includes(k) ? null : rec[k]]));
  try {
    const out = rec.id ? await q(sb.from("rph").update(row).eq("id", rec.id).select().single()) : await q(sb.from("rph").insert(row).select().single());
    const i = S.my.findIndex(r => r.id === out.id); if (i >= 0) S.my[i] = out; else S.my.push(out);
    refreshPending(); updateBadges();
    return out;
  } catch (e) { toast(e.message, true); return null; }
}

  const masa = new Date().toISOString();
  const patch = { log: [...(r.log || []), { nama: S.profile.nama, tindakan: a, teks, masa }] };
  if (a === "disahkan") Object.assign(patch, { status: "disahkan", disahkan_oleh: S.profile.nama, disahkan_pada: masa });
  if (a === "pembetulan") patch.status = "pembetulan";
  await q(sb.from("rph").update(patch).eq("id", id));
  Object.assign(r, patch); const mine = S.my.find(x => x.id === id); if (mine) Object.assign(mine, patch);
  return true;
}

const DESTARX_URLS = ["https://raw.githubusercontent.com/skjalanbintang/destarx/main/jadual.html", "/destarx/jadual.html"];
const SUBJEK_LALAI = { BM: "Bahasa Melayu", BI: "Bahasa Inggeris", MT: "Matematik", SN: "Sains", Sej: "Sejarah", PJ: "Pendidikan Jasmani", PK: "Pendidikan Kesihatan", PSV: "Pendidikan Seni Visual", MZ: "Pendidikan Muzik", PM: "Pendidikan Moral", PAI: "Pendidikan Islam", "PAI(Khatam)": "Pendidikan Islam (Khatam Al-Quran)", BA: "Bahasa Arab", BC: "Bahasa Cina", BT: "Bahasa Tamil", BIB: "Bahasa Iban", RBT: "Reka Bentuk dan Teknologi", TMK: "Teknologi Maklumat dan Komunikasi", Tasmik: "Tasmik Al-Quran" };
const HARI_KOD = { ISNIN: 1, SELASA: 2, RABU: 3, KHAMIS: 4, JUMAAT: 5, MONDAY: 1, TUESDAY: 2, WEDNESDAY: 3, THURSDAY: 4, FRIDAY: 5, MON: 1, TUE: 2, WED: 3, THU: 4, FRI: 5 };
const IMP = { src: "", label: "", teachers: [], users: [], map: {}, sub: {} };
const hhmm = t => { const m = String(t || "").match(/(\d{1,2})[:.](\d{2})/); return m ? `${pad(+m[1])}:${m[2]}` : ""; };
const normN = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();

function mergeEntries(list) {
  const out = [];
  list.sort((a, b) => a.hari - b.hari || a.mula.localeCompare(b.mula)).forEach(e => {
    const p = out.at(-1);
    if (p && p.hari === e.hari && p.kod === e.kod && p.kelas === e.kelas && p.tamat === e.mula) p.tamat = e.tamat;
    else out.push({ ...e });
  });
  return out;
}
function fromDestarx(html) {
  const i = html.indexOf("const VERSION_DATA = "); if (i < 0) throw new Error("Data jadual tidak dijumpai dalam fail DestarX.");
  const s = i + "const VERSION_DATA = ".length, arr = JSON.parse(html.slice(s, html.indexOf("\n];", s) + 2));
  const v = arr.find(x => x.id === (html.match(/DEFAULT_VERSION_ID\s*=\s*"([^"]+)"/) || [])[1]) || arr[0];
  return { label: v.label, teachers: v.data.teachers.map(t => ({ name: t.name, entries: mergeEntries(t.entries.map(e => ({ hari: HARI_KOD[String(e.day).toUpperCase()], mula: hhmm(e.start), tamat: hhmm(e.end), kod: e.subject, kelas: e.class || "" })).filter(e => e.hari)) })) };
}
function fromAscXml(text) {
  const x = new DOMParser().parseFromString(text, "text/xml");
  if (x.querySelector("parsererror")) throw new Error("Fail XML tidak sah.");
  const all = t => [...x.getElementsByTagName(t)], A = (e, k) => e.getAttribute(k) || "";
  const label = (e) => A(e, "short") || A(e, "name");
  const per = Object.fromEntries(all("period").map(p => [A(p, "period") || A(p, "name"), { s: hhmm(A(p, "starttime")), e: hhmm(A(p, "endtime")) }]));
  const subj = Object.fromEntries(all("subject").map(e => [A(e, "id"), label(e)]));
  const teach = Object.fromEntries(all("teacher").map(e => [A(e, "id"), label(e)]));
  const cls = Object.fromEntries(all("class").map(e => [A(e, "id"), label(e)]));
  const les = Object.fromEntries(all("lesson").map(e => [A(e, "id"), e]));
  if (!all("card").length) throw new Error("Tiada <card> dalam fail. Eksport dari aSc: Fail → Eksport → aSc Timetables XML.");
  const byT = {};
  all("card").forEach(c => {
    const l = les[A(c, "lessonid")]; if (!l) return;
    const days = A(c, "days"), di = days.includes("1") ? days.indexOf("1") + 1 : (+A(c, "day") || 0) + 1;
    const pp = A(c, "period"), n = +A(l, "periodspercard") || 1, p1 = per[pp], p2 = per[String(+pp + n - 1)] || p1;
    if (!p1 || di < 1 || di > 5) return;
    const kelas = A(l, "classids").split(",").map(i => cls[i]).filter(Boolean).join("/"), kod = subj[A(l, "subjectid")] || "?";
    A(l, "teacherids").split(",").map(i => teach[i]).filter(Boolean).forEach(t => (byT[t] ??= []).push({ hari: di, mula: p1.s, tamat: p2.e, kod, kelas }));
  });
  return { label: "Fail XML aSc", teachers: Object.entries(byT).map(([name, e]) => ({ name, entries: mergeEntries(e) })) };
}
function fromCsv(text) {
  const rows = text.split(/\r?\n/).map(l => l.split(/\t|,|;/).map(c => c.trim().replace(/^"|"$/g, ""))).filter(r => r.length >= 6 && r[0]);
  if (rows.length && /guru|teacher|nama/i.test(rows[0][0])) rows.shift();
  const byT = {};
  rows.forEach(([g, h, m, t, s, k]) => { const hari = HARI_KOD[h.toUpperCase()] || +h; if (hari >= 1 && hari <= 5) (byT[g] ??= []).push({ hari, mula: hhmm(m), tamat: hhmm(t), kod: s, kelas: k }); });
  if (!Object.keys(byT).length) throw new Error("Tiada baris sah. Format: Guru, Hari, Mula, Tamat, Subjek, Kelas");
  return { label: "Fail CSV", teachers: Object.entries(byT).map(([name, e]) => ({ name, entries: mergeEntries(e) })) };
}
function autoMap(name) {
  const n = normN(name), u = IMP.users;
  let m = u.filter(x => normN(x.nama_asc) === n); if (m.length === 1) return m[0].id;
  if (n.length < 3) return "";
  m = u.filter(x => { const w = normN(x.nama).replace(/^(cikgu|cg|pn|puan|en|encik|tn|dr) /, ""); return w === n || w.split(" ").includes(n) || (n.includes(" ") && w.startsWith(n)); });
  return m.length === 1 ? m[0].id : "";
}
async function loadImport(res) {
  IMP.users = await q(sb.from("profiles").select("id,nama,nama_asc,email,aktif").order("nama"));
  Object.assign(IMP, res, { map: {}, sub: {} });
  IMP.teachers.forEach(t => IMP.map[t.name] = autoMap(t.name));

  [...new Set(IMP.teachers.flatMap(t => t.entries.map(e => e.kod)))].sort().forEach(k => IMP.sub[k] = saved[k] ?? { nama: SUBJEK_LALAI[k] || k, abai: false });
  drawImport();
}

let GCSV = null;
function parseCsv(text) {
  text = text.replace(/^\ufeff/, "");
  const first = text.split(/\r?\n/)[0] || "", dl = first.includes("\t") ? "\t" : (first.split(";").length > first.split(",").length ? ";" : ",");
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') inQ = false; else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === dl) { row.push(cur.trim()); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur.trim()); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur.trim()); rows.push(row); }

}

function detectTable(aoa) {
  const C = v => String(v ?? "").replace(/\s+/g, " ").trim();
  for (let h = 0; h < Math.min(aoa.length, 25); h++) {
    const hd = aoa[h].map(x => C(x).toLowerCase()), f = re => hd.findIndex(x => re.test(x));
    const sk = f(/standard\s*kandungan|content\s*standard|^s\.?k\.?$/), sp = f(/standard\s*pembelajaran|learning\s*standard|^s\.?p\.?$/);
    if (sk < 0 || sp < 0) continue;
    const mg = f(/minggu|week|^m$/), tj = f(/tajuk|topik|topic|unit|title/); let tm = f(/tema|bidang|modul|theme|kemahiran|module/);
    if (tm === tj) tm = -1;
    const out = []; let cur = null, lastTema = "";
    for (const r of aoa.slice(h + 1)) {
      const g = i => i >= 0 ? C(r[i]) : "", m = g(mg), t = g(tj), e = g(tm), a = String(r[sk] ?? "").trim(), b = String(r[sp] ?? "").trim();
      if (!m && !t && !e && !a && !b) continue;
      if (e) lastTema = e;
      if (m || (!cur && (t || a || b)) || (t && cur && cur.tajuk && t !== cur.tajuk)) { cur = { minggu: m || (cur ? cur.minggu : ""), tema: e || lastTema, tajuk: t, sk: a, sp: b }; out.push(cur); }
      else { if (t && !cur.tajuk) cur.tajuk = t; if (a) cur.sk = [cur.sk, a].filter(Boolean).join("\n"); if (b) cur.sp = [cur.sp, b].filter(Boolean).join("\n"); }
    }

}

- tajuk: tajuk / unit / topik.
- sk: SEMUA standard kandungan minggu itu, satu setiap baris (\\n), kekalkan nombor (cth "1.1 Mendengar dan memberikan respons").
- sp: SEMUA standard pembelajaran minggu itu, satu setiap baris (\\n), kekalkan nombor dan ayat penuh.
- Minggu cuti / pentaksiran / program: masukkan sebagai baris dengan tajuk seperti dalam RPT (cth "CUTI PERTENGAHAN PENGGAL"), sk dan sp kosong.
${teks ? "\nKANDUNGAN RPT:\n" + teks.slice(0, 280000) : ""}`;
  const { data, error } = await sb.functions.invoke("jana-rph", { body: { prompt, fail } });
  if (error) throw new Error(error.message);
  if (data?.tiada_kunci) throw new Error("AI belum diaktifkan.");
  if (data?.error) throw new Error(data.error);
  const t = String(data.text || ""), o = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1));
  const b = (o.baris || []).map(x => ({ minggu: String(x.minggu ?? ""), tema: String(x.tema ?? ""), tajuk: String(x.tajuk ?? ""), sk: Array.isArray(x.sk) ? x.sk.join("\n") : String(x.sk ?? ""), sp: Array.isArray(x.sp) ? x.sp.join("\n") : String(x.sp ?? "") }));
  if (!b.length) throw new Error("AI tidak menjumpai baris RPT dalam fail ini.");
  return b;
}
async function bacaRptFail(file, subjek, tahun, msg) {
  const ext = file.name.split(".").pop().toLowerCase();
  if (file.size > 10 * 1024 * 1024) throw new Error("Fail melebihi 10MB.");
  let aoa = null;
  if (["xlsx", "xls", "xlsm", "ods"].includes(ext)) {
    msg("Membaca Excel…"); await loadScript(CDN_XLSX);
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    aoa = wb.SheetNames.flatMap(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: "", raw: false }));
  } else if (["csv", "tsv", "txt"].includes(ext)) {
    aoa = parseCsv(await file.text());
  } else if (ext === "docx") {
    msg("Membaca Word…"); await loadScript(CDN_MAMMOTH);
    const { value } = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
    const d = new DOMParser().parseFromString(value, "text/html");
    aoa = [...d.querySelectorAll("tr")].map(tr => [...tr.children].map(td => [...td.querySelectorAll("p,li")].map(p => p.textContent.trim()).filter(Boolean).join("\n") || td.textContent.trim()));
    if (!aoa.length) { msg("AI sedang membaca RPT…"); return aiRpt(subjek, tahun, d.body.innerText); }
  } else if (ext === "pdf" || ["png", "jpg", "jpeg", "webp"].includes(ext)) {
    msg("AI sedang membaca RPT (boleh mengambil masa 30–90 saat)…");
    return aiRpt(subjek, tahun, "", { mime: ext === "pdf" ? "application/pdf" : `image/${ext === "jpg" ? "jpeg" : ext}`, data: await toB64(file) });
  } else throw new Error("Format tidak disokong. Gunakan Excel, CSV, Word (.docx), PDF atau gambar.");
  const rows = detectTable(aoa);
  if (rows) return rows;
  msg("Lajur SK/SP tidak dikenal pasti — AI sedang membaca RPT…");
  return aiRpt(subjek, tahun, aoa.map(r => r.map(c => String(c).replace(/\n/g, " / ")).join(" | ")).join("\n"));
}
function rptEditor(rec) {
  const row = (b, i) => `<tr data-i="${i}"><td contenteditable>${esc(b.minggu)}</td><td contenteditable>${esc(b.tema)}</td><td contenteditable>${esc(b.tajuk)}</td><td contenteditable style="min-width:200px">${esc(b.sk)}</td><td contenteditable style="min-width:240px">${esc(b.sp)}</td><td><button class="btn sm" type="button" data-act="rptDelRow">✕</button></td></tr>`;
  modal(`📑 ${rec.id ? "Sunting" : "Semak"} RPT · ${esc(rec.subjek)} Tahun ${esc(rec.tahun)}`, `
    <p class="small muted" style="margin-top:0">${rec.baris.length} baris${rec.nama_fail ? ` daripada <b>${esc(rec.nama_fail)}</b>` : ""}. Klik mana-mana sel untuk membetulkan. SK dan SP — satu item setiap baris.</p>
    <div class="grid g2" style="gap:0 12px"><div class="fld"><label class="f">Mata pelajaran</label><input class="in" id="reSub" list="dlSubR" value="${esc(rec.subjek)}"></div>
    <div class="fld"><label class="f">Tahun</label><select class="in" id="reThn">${[1, 2, 3, 4, 5, 6].map(t => `<option ${String(t) === String(rec.tahun) ? "selected" : ""}>${t}</option>`).join("")}</select></div></div>
    <div class="tw rpt-ed" style="max-height:55vh"><table class="t"><thead><tr><th>Minggu</th><th>Tema / Bidang</th><th>Tajuk</th><th>Standard Kandungan</th><th>Standard Pembelajaran</th><th></th></tr></thead>
    <tbody id="reBody">${rec.baris.map(row).join("")}</tbody></table></div>
    <button class="btn sm mt" type="button" data-act="rptAddRow">＋ Tambah baris</button>
    <datalist id="dlSubR">${SUBJEK.map(s => `<option value="${s}">`).join("")}</datalist>`,
    `<button class="btn" data-act="mclose">Batal</button><button class="btn pri" id="reSave">💾 Simpan RPT</button>`, true);
  $("#reSave").onclick = async () => {
    const baris = $$("#reBody tr").map(tr => { const c = [...tr.children].map(td => td.innerText.trim()); return { minggu: c[0], tema: c[1], tajuk: c[2], sk: c[3], sp: c[4] }; }).filter(b => b.tajuk || b.sk || b.sp || b.tema);
    const data = { subjek: $("#reSub").value.trim(), tahun: $("#reThn").value, nama_fail: rec.nama_fail || "", baris, dikemaskini: new Date().toISOString() };
    if (!data.subjek) return toast("Isi mata pelajaran.", true);
    try {
      const out = rec.id ? await q(sb.from("rpt").update(data).eq("id", rec.id).select().single()) : await q(sb.from("rpt").insert(data).select().single());
      S.rpt = [...S.rpt.filter(x => x.id !== out.id), out].sort((a, b) => a.subjek.localeCompare(b.subjek) || a.tahun.localeCompare(b.tahun));
      closeModal(); toast(`RPT ${out.subjek} Tahun ${out.tahun} disimpan (${baris.length} baris).`); if (location.hash.startsWith("#/rpt")) vRpt();
    } catch (e) { toast(e.message, true); }
  };
}
async function vRpt() {
  setTitle("RPT Saya");
  const perlu = [...new Map(S.slots.map(s => [normS(s.subjek) + "|" + tahunDari(s.kelas), { subjek: s.subjek, tahun: tahunDari(s.kelas) }])).values()]
    .filter(x => x.tahun && !rptFor(x.subjek, "Tahun " + x.tahun).length);
  $("#view").innerHTML = `
   <div class="card"><h3>⬆️ Muat naik RPT</h3>
    <p class="small muted" style="margin-top:0">RPT digunakan dalam borang RPH: tema, tajuk, SK dan SP boleh dipilih daripada senarai, dan <b>Jana RPH Sehari</b> akan memilih minggu yang betul secara automatik.</p>
    <div class="row" style="align-items:flex-end">
      <div style="flex:1;min-width:200px"><label class="f">Mata pelajaran</label><input class="in" id="rpSub" list="dlSubR2" placeholder="Bahasa Melayu" value="${esc(perlu[0]?.subjek || "")}"></div>
      <div><label class="f">Tahun</label><select class="in" id="rpThn">${[1, 2, 3, 4, 5, 6].map(t => `<option ${String(t) === perlu[0]?.tahun ? "selected" : ""}>${t}</option>`).join("")}</select></div>
      <label class="btn pri">📄 Pilih fail RPT<input type="file" hidden accept=".xlsx,.xls,.csv,.docx,.pdf,.png,.jpg,.jpeg" data-chg="rptFile"></label>
    </div>
    <div class="small muted mt">Format: <b>Excel / CSV</b> (dibaca terus — lajur Minggu, Tema, Tajuk, Standard Kandungan, Standard Pembelajaran) · <b>Word / PDF / gambar</b> (dibaca oleh AI${S.aiReady ? "" : " — <span style='color:var(--red)'>AI belum diaktifkan</span>"}). Hasil boleh disemak &amp; dibetulkan sebelum disimpan.</div>
    <div class="small mt" id="rpMsg"></div>
    ${perlu.length ? `<div class="mt small"><b>Belum ada RPT untuk kelas anda:</b> ${perlu.map(x => `<button class="btn sm" data-act="rptIsi" data-s="${esc(x.subjek)}" data-t="${x.tahun}">${esc(x.subjek)} T${x.tahun}</button>`).join(" ")}</div>` : ""}
    <datalist id="dlSubR2">${[...new Set([...S.slots.map(s => s.subjek), ...SUBJEK])].map(s => `<option value="${esc(s)}">`).join("")}</datalist></div>
   <div class="grid g3 mt">${S.rpt.map(r => `<div class="card"><h3 style="margin-bottom:4px">📑 ${esc(r.subjek)}</h3><div class="row" style="gap:6px"><span class="chip c-green">Tahun ${esc(r.tahun)}</span><span class="chip c-grey">${r.baris.length} baris</span></div>
      <div class="small muted mt">${esc(r.nama_fail || "")}<br>Dikemas kini ${fmtDT(r.dikemaskini)}</div>
      <div class="row mt"><button class="btn sm" data-act="rptLihat" data-id="${r.id}">Lihat / sunting</button><button class="btn sm" data-act="rptPadam" data-id="${r.id}">🗑</button></div></div>`).join("") || `<div class="empty" style="grid-column:1/-1">Belum ada RPT dimuat naik.</div>`}</div>`;
}
Object.assign(ACT, {
  msOpen(d) {
    const p = $(`#ms_${d.k}`), inp = $(`[name=${d.k}]`), cur = splitVals(inp.value);
    const was = !p.classList.contains("hidden"); $$(".ms-panel").forEach(x => x.classList.add("hidden")); if (was) return;
    const items = [...cur.filter(v => !PILIHAN[d.k].includes(v)), ...PILIHAN[d.k]];
    p.innerHTML = items.map(v => `<label><input type="checkbox" data-chg="msChk" data-k="${d.k}" value="${esc(v)}" ${cur.includes(v) ? "checked" : ""}>${esc(v)}</label>`).join("");
    p.classList.remove("hidden");
  },
  tgPilih(d, b) { const w = b.closest(".tgwrap"), t = w.querySelector(".tgS"); t.value = t.value.trim() ? t.value.trim() + "; " + d.t : d.t; w.querySelector("input[type=checkbox]").checked = true; },
  rptIsi(d) { $("#rpSub").value = d.s; $("#rpThn").value = d.t; },
  rptLihat(d) { rptEditor(clean(S.rpt.find(x => x.id === d.id))); },
  async rptPadam(d) { if (!await confirmBox("Padam RPT ini? RPH yang telah dibina tidak terjejas.")) return; await q(sb.from("rpt").delete().eq("id", d.id)); S.rpt = S.rpt.filter(x => x.id !== d.id); toast("RPT dipadam."); vRpt(); },
  rptDelRow(d, b) { b.closest("tr").remove(); },
  rptAddRow() { $("#reBody").insertAdjacentHTML("beforeend", `<tr><td contenteditable></td><td contenteditable></td><td contenteditable></td><td contenteditable style="min-width:200px"></td><td contenteditable style="min-width:240px"></td><td><button class="btn sm" type="button" data-act="rptDelRow">✕</button></td></tr>`); }
});
Object.assign(CHG, {
  msChk(el) { const inp = $(`[name=${el.dataset.k}]`); let v = splitVals(inp.value); v = el.checked ? [...v.filter(x => x !== el.value), el.value] : v.filter(x => x !== el.value); inp.value = v.join(", "); },
  stdChk(el) { $(`[name=${el.dataset.k}]`).value = $$(`[data-chg=stdChk][data-k=${el.dataset.k}]:checked`).map(c => c.value).join("\n"); },
  rptBaris(el) { RPTSEL.i = el.value === "" ? null : +el.value; drawStd(el.value !== ""); },
  rptPilih(el) { RPTSEL = { rid: el.value, i: null }; fillRptBar(false); },
  rptRefresh() { RPTSEL = {}; fillRptBar(!kandunganAda()); },
  async rptFile(el) {
    const f = el.files[0]; el.value = ""; if (!f) return;
    const sub = $("#rpSub").value.trim(), thn = $("#rpThn").value, msg = t => { $("#rpMsg").innerHTML = `<span class="spin" style="border-color:#ccc;border-top-color:#047857"></span> ${esc(t)}`; };
    if (!sub) return toast("Isi mata pelajaran dahulu.", true);
    try { const baris = await bacaRptFail(f, sub, thn, msg); $("#rpMsg").textContent = ""; rptEditor({ subjek: sub, tahun: thn, nama_fail: f.name, baris }); }
    catch (e) { $("#rpMsg").innerHTML = `<span style="color:var(--red)">❌ ${esc(e.message)}</span>`; }
  }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "ovclose" && e.target !== b) return;
  if (b.tagName === "A" || b.tagName === "BUTTON") e.preventDefault();
  try { await ACT[b.dataset.act]?.(b.dataset, b, e); } catch (err) { console.error(err); toast("Ralat: " + err.message, true); }
});
document.addEventListener("change", e => { const el = e.target.closest("[data-chg]"); if (el) CHG[el.dataset.chg]?.(el)?.catch?.(err => toast(err.message, true)); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !S.forcePw) closeModal(); });

boot();
</script>
